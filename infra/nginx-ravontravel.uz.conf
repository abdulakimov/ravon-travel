# ravontravel.uz — host-nginx server block (new-vps 167.86.86.68, ULASHILGAN box).
#
# Box konventsiyasi: har sayt sites-available'da o'z fayli, localhost portiga proxy,
# TLS certbot (HTTP-01, webroot /var/www/letsencrypt). Boshqa vhost'larga TEGILMAYDI.
# :80 bloki qo'lda yozilgan (`certbot --nginx` EMAS).
#
# O'rnatish (docs/DEPLOY.md'da to'liq):
#   1) faqat :80 bloki bilan yoqiladi → nginx -t && systemctl reload nginx
#   2) certbot certonly --webroot -w /var/www/letsencrypt --cert-name ravontravel.uz \
#        -d ravontravel.uz -d www.ravontravel.uz
#   3) to'liq fayl (shu) qo'yiladi → nginx -t && systemctl reload nginx

# ── :80 — ACME + HTTPS ga yo'naltirish ───────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ravontravel.uz www.ravontravel.uz;

    # Sertifikat yangilanishi ilova o'chiq bo'lsa ham ishlaydi — proxy'ga tushmaydi.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://ravontravel.uz$request_uri;
    }
}

# ── :443 — www → apex ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ravontravel.uz;

    ssl_certificate     /etc/letsencrypt/live/ravontravel.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravontravel.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    return 301 https://ravontravel.uz$request_uri;
}

# ── :443 — ilova (Next.js, 127.0.0.1:3130) ───────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ravontravel.uz;

    ssl_certificate     /etc/letsencrypt/live/ravontravel.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravontravel.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Sayt faqat kichik JSON formalar qabul qiladi.
    client_max_body_size 64k;
    server_tokens off;

    # includeSubDomains ataylab yo'q: kelajakdagi subdomenlar (pochta, CRM) majburlanmasin.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    # Kesh sarlavhalarini Next o'zi to'g'ri beradi (200 → immutable, 404 → no-store) — nginx qo'shmaydi.
    location / {
        proxy_pass http://127.0.0.1:3130;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # X-Real-IP ni nginx o'zi qo'yadi — ilova rate-limit uchun shunga ishonadi.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# admin.ravontravel.uz — admin panel (xuddi shu Next.js ilova, 127.0.0.1:3130; ilova Host bo'yicha ajratadi).
#
# Shared box: boshqa vhost'larga TEGILMAYDI. TLS — certbot HTTP-01 webroot (alohida cert: admin.ravontravel.uz).
# O'rnatish (docs/DEPLOY.md → "Admin panel"):
#   1) faqat :80 bloki bilan yoqiladi → nginx -t && systemctl reload nginx
#   2) certbot certonly --webroot -w /var/www/letsencrypt --cert-name admin.ravontravel.uz -d admin.ravontravel.uz
#   3) to'liq fayl (shu) qo'yiladi → nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name admin.ravontravel.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://admin.ravontravel.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.ravontravel.uz;

    ssl_certificate     /etc/letsencrypt/live/admin.ravontravel.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.ravontravel.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Rasm yuklash (ilova 10 MB gacha qabul qiladi) — faqat admin blokida katta.
    client_max_body_size 12m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3130;
        proxy_http_version 1.1;
        # Host — ilova admin panelni shu bo'yicha ajratadi; Server Actions Origin ↔ Host tekshiruvi ham shunga tayanadi.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

      <a data-nav="catalog" href="Ravon%20Travel%20-%20Turlar%20katalogi.dc.html" style="color:#333333;padding:6px 0;border-bottom:1.5px solid transparent" style-hover="color:#0A66E8;border-bottom-color:rgba(10,102,232,0.45)">Turlar</a>
      <a data-nav="dest" href="Ravon%20Travel%20-%20Turlar%20katalogi.dc.html" style="color:#333333;padding:6px 0;border-bottom:1.5px solid transparent" style-hover="color:#0A66E8;border-bottom-color:rgba(10,102,232,0.45)">Yo'nalishlar</a>
      <a data-nav="blog" href="Ravon%20Travel%20-%20Bosh%20sahifa.dc.html#blog" style="color:#333333;padding:6px 0;border-bottom:1.5px solid transparent" style-hover="color:#0A66E8;border-bottom-color:rgba(10,102,232,0.45)">Blog</a>
      <a data-nav="about" href="Ravon%20Travel%20-%20Biz%20haqimizda.dc.html" style="color:#333333;padding:6px 0;border-bottom:1.5px solid transparent" style-hover="color:#0A66E8;border-bottom-color:rgba(10,102,232,0.45)">Biz haqimizda</a>

    <div style="display:flex;align-items:center;gap:12px;flex-shrink:0">
      <div data-no-i18n="1" role="group" aria-label="Til / Язык / Language" style="display:flex;align-items:center;gap:2px;padding:3px;border:1px solid #DCE7F5;border-radius:99px;background:#FFFFFF">
        <button data-lang="uz" onClick="{{ setUz }}" style="border:0;background:transparent;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#5C5C5C;min-height:30px">UZ</button>
        <button data-lang="ru" onClick="{{ setRu }}" style="border:0;background:transparent;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#5C5C5C;min-height:30px">RU</button>
        <button data-lang="en" onClick="{{ setEn }}" style="border:0;background:transparent;border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:0.04em;color:#5C5C5C;min-height:30px">EN</button>
      </div>

      <a data-vp="desktop" data-vpd="inline-flex" href="Ravon%20Travel%20-%20Turlar%20katalogi.dc.html" style="display:inline-flex;align-items:center;gap:8px;background:#0A66E8;color:#FFFFFF;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:600;min-height:44px;transition:background 0.3s cubic-bezier(0.4,0,0.2,1),transform 0.3s cubic-bezier(0.4,0,0.2,1)" style-hover="transform:translateY(-1px);color:#FFFFFF">
        <svg data-no-i18n="1" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><rect x="3.4" y="5.2" width="17.2" height="15.4" rx="2.6"/><path d="M8.2 3v4.2M15.8 3v4.2M3.4 10.4h17.2"/><path d="M9.4 14.8l1.9 1.9 3.5-3.6"/></svg><span>Bron qilish</span>
      </a>

      <button data-vp="mobile" data-vpd="inline-flex" onClick="{{ toggleMenu }}" aria-label="Menyu" style="display:none;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #DCE7F5;border-radius:12px;background:#FFFFFF;color:#0B1B33">
        <svg data-no-i18n="1" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7.2h16M4 12h16M4 16.8h10.5"/></svg>
      </button>
    </div>
  </div>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:90;background:#FFFFFF;display:flex;flex-direction:column">
    <div style="height:76px;padding:0 clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #DCE7F5">
      <span data-no-i18n="1" style="display:flex;align-items:center;gap:10px"><svg data-no-i18n="1" width="34" height="34" viewBox="0 0 48 48" aria-hidden="true" style="flex:none;display:block"><circle cx="24" cy="24" r="24" style="fill:#0A66E8"/><path d="M14.5 26.5a9.5 9.5 0 0 1 19 0z" style="fill:#FFC233"/><path d="M9 31.6c5-3.2 10-3.2 15 0s10 3.2 15 0" style="fill:none;stroke:#FFFFFF;stroke-width:2.6;stroke-linecap:round"/><path d="M15 37c3-1.9 6-1.9 9 0s6 1.9 9 0" style="fill:none;stroke:#FFFFFF;stroke-width:2.2;stroke-linecap:round;opacity:0.55"/></svg><span data-no-i18n="1" style="display:flex;flex-direction:column;gap:4px;line-height:1"><span style="font-size:17px;font-weight:800;letter-spacing:0.2em;color:#0B1B33">RAVON</span><span style="font-size:7.2px;font-weight:700;letter-spacing:0.66em;color:#0A66E8">TRAVEL</span></span></span>
      <button onClick="{{ closeMenu }}" aria-label="Yopish" style="width:44px;height:44px;border:1px solid #DCE7F5;border-radius:12px;background:#FFFFFF;color:#0B1B33;display:grid;place-items:center"><svg data-no-i18n="1" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M6.2 6.2l11.6 11.6M17.8 6.2L6.2 17.8"/></svg></button>
    </div>
    <nav style="flex:1;padding:18px clamp(18px,4vw,48px);display:flex;flex-direction:column;gap:2px;overflow-y:auto">
      <a href="Ravon%20Travel%20-%20Bosh%20sahifa.dc.html" style="font-family:'Manrope',system-ui,sans-serif;font-size:26px;padding:14px 0;border-bottom:1px solid #DCE7F5">Bosh sahifa</a>
      <a href="Ravon%20Travel%20-%20Turlar%20katalogi.dc.html" style="font-family:'Manrope',system-ui,sans-serif;font-size:26px;padding:14px 0;border-bottom:1px solid #DCE7F5">Turlar</a>
      <a href="Ravon%20Travel%20-%20Turlar%20katalogi.dc.html" style="font-family:'Manrope',system-ui,sans-serif;font-size:26px;padding:14px 0;border-bottom:1px solid #DCE7F5">Yo'nalishlar</a>
      <a href="Ravon%20Travel%20-%20Bosh%20sahifa.dc.html#blog" style="font-family:'Manrope',system-ui,sans-serif;font-size:26px;padding:14px 0;border-bottom:1px solid #DCE7F5">Blog</a>
      <a href="Ravon%20Travel%20-%20Biz%20haqimizda.dc.html" style="font-family:'Manrope',system-ui,sans-serif;font-size:26px;padding:14px 0;border-bottom:1px solid #DCE7F5">Biz haqimizda</a>
      <a href="Ravon%20Travel%20-%20Aloqa.dc.html" style="font-family:'Manrope',system-ui,sans-serif;font-size:26px;padding:14px 0">Aloqa</a>
      <a href="Ravon%20Travel%20-%20Turlar%20katalogi.dc.html" style="margin-top:22px;display:flex;align-items:center;justify-content:center;background:#0A66E8;color:#FFFFFF;padding:16px;border-radius:14px;font-size:15px;font-weight:600">Bron qilish</a>
    </nav>
  </div>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 76 },
  &quot;active&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;catalog&quot;, &quot;dest&quot;, &quot;blog&quot;, &quot;about&quot;, &quot;contact&quot;], &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;locale&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;uz&quot;, &quot;ru&quot;, &quot;en&quot;], &quot;default&quot;: &quot;uz&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;onLocale&quot;: { &quot;editor&quot;: null, &quot;tsType&quot;: &quot;(locale: string) =&gt; void&quot; }
}">
class Component extends DCLogic {
  state = { menuOpen: false };

  root() { return document.querySelector("[data-rt-hd]"); }

  renderVals() {
    const set = loc => () => {
      this.setState({ menuOpen: false });
      if (this.props.onLocale) this.props.onLocale(loc);
    };
    return {
      menuOpen: this.state.menuOpen,
      setUz: set("uz"),
      setRu: set("ru"),
      setEn: set("en"),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false })
    };
  }

  componentDidMount() {
    this.sync();
    this._vp = () => window.RT && window.RT.applyViewport(this.root());
    window.addEventListener("resize", this._vp);
    this._sc = () => {
      const h = this.root();
      if (h) h.style.boxShadow = window.scrollY > 24 ? "0 6px 26px rgba(11,27,51,0.1)" : "none";
    };
    window.addEventListener("scroll", this._sc, { passive: true });
  }

  componentDidUpdate() { this.sync(); }

  componentWillUnmount() {
    window.removeEventListener("resize", this._vp);
    window.removeEventListener("scroll", this._sc);
  }

  sync() {
    const root = this.root();
    if (!root || !window.RT) return;
    const loc = this.props.locale || "uz";
    window.RT.applyLocale(root, loc);
    window.RT.applyLangButtons(root, loc);
    window.RT.applyViewport(root);
    const active = this.props.active || "home";
    root.querySelectorAll("[data-nav]").forEach(a => {
      const on = a.dataset.nav === active;
      a.style.color = on ? "#0A66E8" : "#333333";
      a.style.borderBottomColor = on ? "#0A66E8" : "transparent";
      a.style.fontWeight = on ? "600" : "500";
    });
  }
}

</script>
</body>
</html>

# Bitta fayl ikki rejimda: lokalda `docker compose up --build` (build:), serverda
# CI `docker compose pull web && docker compose up -d web` (image: GHCR'dan).
# IMAGE_REGISTRY + IMAGE_TAG ni deploy job eksport qiladi.

name: ravon-travel

services:
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/nodirmuxammadjanov}/ravon-travel-web:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment:
      NODE_ENV: production
    # Faqat localhost: tashqi trafik host nginx (TLS) orqali keladi.
    ports:
      - "127.0.0.1:${HOST_PORT:-3130}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

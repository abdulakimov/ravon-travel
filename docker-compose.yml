# Bitta fayl ikki rejimda: lokalda `docker compose up --build` (build:), serverda
# CI `docker compose pull web && docker compose up -d web` (image: GHCR'dan).
# IMAGE_REGISTRY + IMAGE_TAG ni deploy job eksport qiladi.

name: ravon-travel

services:
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/abdulakimov}/ravon-travel-web:${IMAGE_TAG:-latest}
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    env_file: [{ path: .env, required: false }]
    environment:
      NODE_ENV: production
    # Alohida compose tarmog'i yaratilmaydi: ulashilgan box'da docker'ning manzil hovuzlari tugagan
    # ("all predefined address pools have been fully subnetted"). Bitta servisga default bridge yetarli.
    network_mode: bridge
    # Faqat localhost: tashqi trafik host nginx (TLS) orqali keladi.
    ports:
      - "127.0.0.1:${HOST_PORT:-3130}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /app/.next/cache:size=64m
    # Aloqa/so'rov/bron xabarlari (leads.ndjson) — deploy'dan omon qoladi. uid 1000 (node) ga tegishli.
    volumes:
      - ./data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    # Ulashilgan box: rasm optimizatsiyasi boshqa saytlarning CPU'sini yemasin.
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
